name: Web Deployment Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-verify:
    name: Lint, Test, and Build Next.js Web Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite (Recipe Coverage, AI Chef, Security)
        run: npm test

      - name: Type Check Next.js Application
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Verify Deployment Gate
        run: npm run deploy:verify

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="misevaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#062419" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Glass Outer Ring -->
    <linearGradient id="glassRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F5132" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Culinary Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Herb Leaf / Ingredient Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- AI Node Core -->
    <linearGradient id="aiCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#misevaGlow)"/>

  <!-- Outer Liquid-Glass Pill Disc -->
  <circle cx="256" cy="256" r="216" fill="#062419" stroke="url(#glassRing)" stroke-width="6" filter="url(#badgeShadow)"/>

  <!-- Inner Concentric Frosted Glass Ring -->
  <circle cx="256" cy="256" r="192" fill="#0A3826" fill-opacity="0.5" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="2"/>

  <!-- THE FLAME EMBLEM (Culinary Heat & Hearth) -->
  <path d="M 256 100 C 290 160 340 220 340 286 C 340 336 304 374 256 374 C 248 374 240 372 232 368 C 260 348 276 316 276 278 C 276 226 238 184 216 150 C 230 134 244 116 256 100 Z" fill="url(#flameGrad)" />

  <!-- THE LEAF EMBLEM (Fresh Ingredients & Mise en Place) -->
  <path d="M 256 100 C 220 160 172 220 172 286 C 172 336 208 374 256 374 C 234 350 222 316 222 278 C 222 226 250 178 256 100 Z" fill="url(#leafGrad)" opacity="0.95" />

  <!-- AI ORBITAL RING & CONNECTED NODE -->
  <circle cx="256" cy="286" r="38" fill="url(#aiCore)" filter="url(#badgeShadow)"/>
  <circle cx="256" cy="286" r="54" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.7"/>
  
  <!-- AI Orbital Micro-Nodes -->
  <circle cx="218" cy="286" r="5" fill="#FDE68A"/>
  <circle cx="294" cy="286" r="5" fill="#34D399"/>
  <circle cx="256" cy="248" r="5" fill="#FFFFFF"/>
</svg>

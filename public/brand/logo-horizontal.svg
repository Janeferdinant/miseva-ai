<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Liquid Glass Gradient -->
    <linearGradient id="hzGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0F5132"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="hzFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="hzLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- AI Core Gradient -->
    <linearGradient id="hzAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM (Left: Center X=100, Center Y=100) -->
  <g transform="translate(10, 10) scale(0.35)">
    <!-- Outer Disc -->
    <circle cx="256" cy="256" r="216" fill="#062419" stroke="url(#hzGlass)" stroke-width="8"/>
    <circle cx="256" cy="256" r="192" fill="#0A3826" fill-opacity="0.6"/>

    <!-- Flame -->
    <path d="M 256 100 C 290 160 340 220 340 286 C 340 336 304 374 256 374 C 248 374 240 372 232 368 C 260 348 276 316 276 278 C 276 226 238 184 216 150 C 230 134 244 116 256 100 Z" fill="url(#hzFlame)" />

    <!-- Leaf -->
    <path d="M 256 100 C 220 160 172 220 172 286 C 172 336 208 374 256 374 C 234 350 222 316 222 278 C 222 226 250 178 256 100 Z" fill="url(#hzLeaf)" opacity="0.95" />

    <!-- AI Node Core -->
    <circle cx="256" cy="286" r="38" fill="url(#hzAi)"/>
    <circle cx="256" cy="286" r="54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>
  </g>

  <!-- WORDMARK "Miseva" -->
  <text x="220" y="115" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#0F5132" letter-spacing="-1.5">Miseva</text>

  <!-- "AI" BADGE -->
  <rect x="500" y="58" width="105" height="66" rx="16" fill="#059669"/>
  <text x="522" y="108" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="1">AI</text>

  <!-- TAGLINE -->
  <text x="224" y="152" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#D97706" letter-spacing="1.5">YOUR WORLD. YOUR KITCHEN. YOUR AI CHEF.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="priGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#062419" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="priGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F5132" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="priFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="priLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="priAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="priShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base Disc -->
  <rect width="512" height="512" rx="112" fill="#062419"/>
  <circle cx="256" cy="220" r="220" fill="url(#priGlow)"/>

  <!-- Logo Mark Lockup -->
  <g transform="translate(48, 20) scale(0.82)">
    <circle cx="256" cy="256" r="200" fill="#0A3826" stroke="url(#priGlass)" stroke-width="8" filter="url(#priShadow)"/>
    <!-- Flame -->
    <path d="M 256 100 C 290 160 340 220 340 286 C 340 336 304 374 256 374 C 248 374 240 372 232 368 C 260 348 276 316 276 278 C 276 226 238 184 216 150 C 230 134 244 116 256 100 Z" fill="url(#priFlame)" />
    <!-- Leaf -->
    <path d="M 256 100 C 220 160 172 220 172 286 C 172 336 208 374 256 374 C 234 350 222 316 222 278 C 222 226 250 178 256 100 Z" fill="url(#priLeaf)" opacity="0.95" />
    <!-- AI Core -->
    <circle cx="256" cy="286" r="38" fill="url(#priAi)"/>
    <circle cx="256" cy="286" r="54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>
  </g>

  <!-- Wordmark "Miseva AI" -->
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Miseva <tspan fill="#34D399">AI</tspan></text>
  <text x="256" y="475" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#F59E0B" letter-spacing="2">YOUR WORLD. YOUR KITCHEN. YOUR AI CHEF.</text>
</svg>
